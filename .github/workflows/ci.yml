name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # headroom: the packaging test builds a wheel and creates a venv on every leg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # planguard itself is NOT installed: the suite must pass from a bare checkout
      # (pytest puts src/ on the path); `build` is for the packaging test.
      - name: Install test tools
        run: python -m pip install pytest build
      - name: Run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev tools (exact versions)
        run: python -m pip install "ruff==0.17.4" "mypy==2.4.1"
      - name: ruff
        run: ruff check src
      - name: mypy (strict, configured in pyproject.toml)
        run: mypy
