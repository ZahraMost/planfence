# Manual publish to TestPyPI or PyPI with Trusted Publishing (OIDC): the job gets a short-lived identity
# token from GitHub; nothing is stored in the repository settings.
# Run it from the Actions tab (workflow_dispatch). The tag must already exist; it is built as it is.
# One-time setup on the index (not in this repo): a trusted publisher for this repository, workflow
# publish.yml and the environment named like the target (testpypi / pypi). Protect the `pypi`
# environment with required reviewers.
name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      tag:
        description: Git tag to build and publish
        type: string
        default: v0.1.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: The version in pyproject.toml must equal the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != "v" + version:
              sys.exit(f"tag {tag!r} does not match pyproject.toml version {version!r}")
          print(f"version {version} matches tag {tag}")
          PY
      - run: python -m pip install twine && twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
