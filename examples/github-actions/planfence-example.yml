# EXAMPLE ONLY - copy into your own repository's .github/workflows/ and adapt.
# It is deliberately kept outside .github/workflows/ here so it does not run
# in the planfence repo itself.
#
# Flow: terraform plan -> terraform show -json -> planfence. Nothing is applied.
name: terraform-plan-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper adds extra lines to stdout and would corrupt the JSON.
          terraform_wrapper: false

      # OpenTofu users: use `tofu plan` / `tofu show -json` (e.g. opentofu/setup-opentofu), set
      # plan_source = "opentofu" in the PROTECTED contract, and NEVER pass -target or -exclude:
      # planfence cannot recognise an OpenTofu partial plan (Terraform marks it complete=false).
      #
      # Provide your own provider credentials/backend config here (for example via
      # OIDC). planfence itself needs no credentials and never contacts the cloud.
      - name: Terraform plan
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      - name: Plan to JSON
        run: |
          terraform show -json tfplan > plan.json
          sha256sum tfplan > tfplan.sha256

      # Pin planfence to a release tag or a commit that you trust. The planfence version is part of the
      # trust boundary: whoever can change what is installed here can change what is checked.
      # A v0.1.0 tag is created when the release is published. planfence has no runtime dependencies.
      - name: Install planfence
        run: python -m pip install "git+https://github.com/ZahraMost/planfence.git@v0.1.0"

      # SECURITY: load the contract from the BASE branch, not from the PR checkout, so the
      # PR author cannot weaken it. (Alternatively protect planfence.toml with CODEOWNERS
      # and branch protection.)
      - name: Load contract from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:planfence.toml" > "$RUNNER_TEMP/planfence.toml"

      # Exit 0 = within contract, 1 = violation, 2 = plan/config not understood.
      # Any non-zero exit fails the job (fail-closed). A pass is not an approval.
      - name: Check plan against contract
        run: planfence plan.json --config "$RUNNER_TEMP/planfence.toml"

      # If a later step applies, apply EXACTLY this plan file (never re-plan):
      #   sha256sum -c tfplan.sha256 && terraform apply tfplan

      # plan.json and tfplan contain attribute values (possibly secrets):
      # remove them and never upload them as artifacts.
      - name: Remove plan files
        if: always()
        run: rm -f plan.json tfplan tfplan.sha256
