[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "planfence"
version = "0.1.1"
description = "Deterministic guardrail for Terraform/OpenTofu plan JSON."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ZahraMost"}]
keywords = ["terraform", "opentofu", "plan", "guardrail", "infrastructure-as-code", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ZahraMost/planfence"
Repository = "https://github.com/ZahraMost/planfence"
Issues = "https://github.com/ZahraMost/planfence/issues"
Changelog = "https://github.com/ZahraMost/planfence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "build", "ruff", "mypy"]

[project.scripts]
planfence = "planfence.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---- dev-only quality gates (not runtime dependencies); CI runs both on src/ ----
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
# the gates cover the shipped package only; tests/ and scripts/ are not linted (yet)
extend-exclude = ["tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "PERF", "ARG", "PL"]
ignore = [
    "PLR2004",  # magic values: exit codes and limits are named where it matters
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity counters: parse_plan is deliberately linear
    "PLC0415",  # imports inside functions are intentional (lazy imports in __main__.run and cli._version)
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
